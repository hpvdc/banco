<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Banco">
  <meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <title>Banco</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="icon" href="icones/icone-192.png">
  <style>
    :root { --fundo: #f3f4f1; --cartao: #fff; --texto: #15181c; --texto-2: #5b636d; --linha: #dfe2dc; --primario: #1d6b3a; --falha: #c8352b; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #14161a; --cartao: #1e2126; --texto: #eef0f2; --texto-2: #9aa3ad; --linha: #2e333a; --primario: #2f9a57; --falha: #ff6b5e; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--fundo); color: var(--texto); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 16px; }
    form { width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: 18px; background: var(--cartao); border: 1px solid var(--linha); }
    h1 { margin: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 36px; height: 36px; border-radius: 9px; }
    input[type=password] { min-height: 52px; padding: 0 14px; border: 1px solid var(--linha); border-radius: 12px; background: var(--fundo); color: var(--texto); font: inherit; font-size: 1.1rem; }
    label { display: flex; align-items: center; gap: 10px; color: var(--texto-2); min-height: 40px; }
    label input { width: 22px; height: 22px; accent-color: var(--primario); }
    button { min-height: 52px; border: 0; border-radius: 12px; background: var(--primario); color: #fff; font: inherit; font-weight: 700; font-size: 1.05rem; }
    button:disabled { opacity: 0.6; }
    #erro { margin: 0; min-height: 1.4em; color: var(--falha); font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>

    <label><input id="lembrar" type="checkbox" checked> Lembrar neste iPad</label>
